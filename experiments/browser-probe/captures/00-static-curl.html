科研/实践项目中的角色与产出，以便我们更快速了解你。\\n\"},{\"attributes\":{\"fontcolor\":\"var(--basic-color1-darkest)\",\"bold\":\"true\"},\"insert\":\"Q2 如投递提前批后，简历没有进入筛选流程，正式批还需要再次投递吗？\"},{\"insert\":\"\\n\"},{\"attributes\":{\"lmkr\":\"1\",\"hid\":\"6Wla8M8I5CDa\"},\"insert\":\"*\"},{\"insert\":\"不需要。如未进入提前批招聘流程，我们将会在正式批优先筛选您的简历，无需二次投递。\\n\"},{\"attributes\":{\"lmkr\":\"1\",\"hid\":\"6Wla8M8I5CDa\"},\"insert\":\"*\"},{\"attributes\":{\"fontcolor\":\"var(--basic-color1-darkest)\",\"bold\":\"true\"},\"insert\":\"Q3 如提前批筛选/面试未通过，是否影响正式批次投递？\"},{\"insert\":\"\\n\"},{\"attributes\":{\"lmkr\":\"1\",\"hid\":\"6Wla8M8I5CDa\"},\"insert\":\"*\"},{\"insert\":\"不影响。正式批和提前批项目独立，可再次投递正式批，如遇无法投递的情况可能是内推判重影响，可尝试不使用内推码或联系zhaopin@bambulab.com，说明您的个人信息、希望重新投递的岗位，HR会批量操作。\\n\"},{\"attributes\":{\"lmkr\":\"1\",\"hid\":\"6Wla8M8I5CDa\"},\"insert\":\"*\"},{\"attributes\":{\"fontcolor\":\"var(--basic-color1-darkest)\",\"bold\":\"true\"},\"insert\":\"Q4 如何查询招聘进度？\"},{\"insert\":\"\\n\"},{\"insert\":\"1. 进入校招官网（电脑端/移动端），右上角登录个人账号——点击个人头像——点击投递记录，查看投递职位进程。\\n\"},{\"attributes\":{\"lmkr\":\"1\"},\"insert\":\"*\"},{\"insert\":\"2. 如您已进入面试环节，面试后2周无反馈，可通过面试邀约邮件中的HR联系方式询问进展。\\n\"},{\"attributes\":{\"heading\":\"Paragraph-3\",\"lmkr\":\"1\",\"hid\":\"DPjSNXAzTzkM\"},\"insert\":\"*\"},{\"insert\":\"3. 除此之外，您也可以邮件联系zhaopin@bambulab.com，说明您的个人信息、投递岗位、问题，HR将定期回复。\\n\"},{\"attributes\":{\"hid\":\"6fiLbHVsyc2k\",\"lmkr\":\"1\",\"heading\":\"Paragraph-1\"},\"insert\":\"*\"},{\"insert\":\"\\n\"},{\"attributes\":{\"heading\":\"Paragraph-3\",\"lmkr\":\"1\",\"hid\":\"o22xcIH1OA2S\"},\"insert\":\"*\"},{\"attributes\":{\"fontcolor\":\"var(--basic-color1-darkest)\"},\"insert\":\"注意：近期发现有冒充拓竹招聘进行收费测评、面经售卖的行为，拓竹校招不存在任何付费测评环节，各位擦亮双眼，谨防受骗。\"},{\"insert\":\"\\n\"},{\"attributes\":{\"lmkr\":\"1\",\"heading\":\"Paragraph-3\",\"hid\":\"mVN14otUbV9X\"},\"insert\":\"*\"},{\"attributes\":{\"fontcolor\":\"var(--basic-color1-darkest)\"},\"insert\":\"了解更多拓竹动态，欢迎关注“拓竹科技”官方微信公众号和小红书账号。\"},{\"insert\":\"\\n\"}],\"zoneId\":\"0\",\"zoneType\":\"Z\"}},
